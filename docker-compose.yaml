# Local stack of crypto-market-dwh: Airflow (LocalExecutor) and the project's
# own commands, both from the image built by the Dockerfile.
#
#   docker compose build project
#   docker compose up -d                  # Airflow UI on http://localhost:8080
#   docker compose run --rm project python -m ingestion.check_snowflake
#   docker compose run --rm project dbt build
#   docker compose build dashboard          # dashboard on http://localhost:8502
#
# Compose reads the repo's .env only to fill in ${...} below; a container gets
# nothing from it unless the variable is listed under `environment:`. Host
# paths in .env (keys, dbt) are replaced by container paths here, and the key
# files arrive as read-only secrets under /run/secrets.
#
# Only the scheduler runs tasks (LocalExecutor), so only the scheduler and the
# `project` service get the Snowflake variables and keys; the API server, the
# DAG processor and postgres never see them.
#
# The dashboard has an image of its own (no Airflow, no Snowflake connector) and
# sees only data/marts, read-only: it reads the exports, never Snowflake.
#
# Alerts (dags/alerting) are sent from the scheduler (task callbacks) and the
# DAG processor (run callbacks, callbacks of tasks ended from outside), so
# those two get the Telegram bot and the watchdog URL.
#
# `docker compose config` prints the file with secrets filled in: run it only
# as `docker compose config --quiet`.

# Not crypto-market-dwh: that is the Snowflake original's stack on the same machine.
name: crypto-market-dwh-duckdb

x-project-env: &project-env
  # Loader: service user CRYPTO_LOADER (ingestion/clients/snowflake_conn.py).
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
  SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_loader_key
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
  SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-}
  # dbt: service user CRYPTO_DBT (dbt/profiles.yml).
  DBT_PROJECT_DIR: /opt/project/dbt
  DBT_PROFILES_DIR: /opt/project/dbt
  SNOWFLAKE_DBT_PRIVATE_KEY_PATH: /run/secrets/snowflake_dbt_key
  DBT_ENV_SECRET_SNOWFLAKE_DBT_KEY_PASSPHRASE: ${DBT_ENV_SECRET_SNOWFLAKE_DBT_KEY_PASSPHRASE:-}
  # Export of the marts: read-only service user CRYPTO_REPORTER (ingestion/export_marts.py).
  SNOWFLAKE_REPORTER_PRIVATE_KEY_PATH: /run/secrets/snowflake_reporter_key
  SNOWFLAKE_REPORTER_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_REPORTER_PRIVATE_KEY_PASSPHRASE:-}

# Airflow settings shared by every Airflow component. There is no shared
# airflow.cfg: a container without one writes its own with a random JWT
# secret, API secret key and Fernet key, so these come from .env instead
# (`:?` stops compose when one is missing rather than run with a random or
# empty value).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}@postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # DAGs live with the project code (a copy is baked into the image).
  AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

# Alert channels. `:?` as for the Airflow secrets: an empty value would turn
# the alerts off without a word.
x-alert-env: &alert-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
  PIPELINE_HEARTBEAT_URL: ${PIPELINE_HEARTBEAT_URL:?set PIPELINE_HEARTBEAT_URL in .env}

x-airflow-common: &airflow-common
  image: crypto-market-dwh:dev
  # Airflow components start only after the database is migrated.
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      # Applied only when the volume is first created; changing it in .env
      # later needs ALTER USER inside postgres (or a new volume).
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Migrates the metadata database and creates the admin user, then exits.
  # Not the image's _AIRFLOW_DB_MIGRATE/_AIRFLOW_WWW_USER_CREATE: the entrypoint
  # runs those as `... || true`, so a failed migration would still let the
  # other components start. `users create` leaves an existing user as it is.
  airflow-init:
    image: crypto-market-dwh:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        airflow users create --role Admin \
          --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Airflow --lastname Admin --email admin@localhost
        airflow version

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    environment:
      <<: *airflow-env
    # Loopback only: the UI is not reachable from the local network.
    ports:
      - "127.0.0.1:8080:8080"
    # Task logs, written by the scheduler and read here for the UI.
    volumes:
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Runs the tasks (LocalExecutor): the only Airflow component with the
  # project's Snowflake variables, keys and landing zone.
  airflow-scheduler:
    <<: *airflow-common
    # with-private-keys first (owner-only key copies), then the image's own
    # entrypoint, which turns `scheduler` into `airflow scheduler`.
    entrypoint: ["/usr/bin/dumb-init", "--", "with-private-keys", "/entrypoint"]
    command: ["scheduler"]
    environment:
      <<: [*airflow-env, *project-env, *alert-env]
      PROJECT_KEYS_DIR: /run/project-keys
    # Explicit mode: on a container restart (Docker or Windows reboot) Docker
    # remounts a tmpfs without one as 755 root, and with-private-keys fails.
    tmpfs:
      - /run/project-keys:mode=1777
    volumes:
      - airflow-logs:/opt/airflow/logs
      # Development: the repo's DAGs over the baked-in copy, read-only.
      - ./dags:/opt/project/dags:ro
      - ./data:/opt/project/data
    secrets:
      - snowflake_loader_key
      - snowflake_dbt_key
      - snowflake_reporter_key
    # Tasks report to the execution API on the API server.
    depends_on:
      <<: *airflow-depends-on
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    environment:
      <<: [*airflow-env, *alert-env]
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./dags:/opt/project/dags:ro
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Runs the project's own commands (ingestion, dbt) without Airflow.
  project:
    build:
      context: .
      target: runtime
    image: crypto-market-dwh:dev
    profiles: ["tools"]
    # Bypass Airflow's /entrypoint, which turns any command into `airflow ...`;
    # dumb-init still forwards Ctrl+C, with-private-keys prepares the keys.
    entrypoint: ["/usr/bin/dumb-init", "--", "with-private-keys"]
    command: ["bash"]
    working_dir: /opt/project
    environment:
      <<: *project-env
      # The project venv first; Airflow's own venv is not on the path.
      PATH: /opt/project-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PROJECT_KEYS_DIR: /run/project-keys
    # In-memory directory for the owner-only key copies (with-private-keys);
    # explicit mode for the same reason as the scheduler's.
    tmpfs:
      - /run/project-keys:mode=1777
    volumes:
      # The landing zone is the extract's high-water mark: one copy, shared
      # with the host, never a separate volume.
      - ./data:/opt/project/data
    # Read-only, but shown as 0777 when mounted from Windows; compose ignores
    # uid/gid/mode outside Swarm, hence with-private-keys.
    secrets:
      - snowflake_loader_key
      - snowflake_dbt_key
      - snowflake_reporter_key

  # Read-only dashboard over the newest mart export (dashboard/). No Snowflake variables,
  # no keys, no Airflow: only data/marts, mounted read-only; root filesystem read-only.
  dashboard:
    build:
      context: .
      target: dashboard
    image: crypto-market-dwh-duckdb-dashboard:dev
    environment:
      MARTS_DIR: /data/marts
    volumes:
      - ./data/marts:/data/marts:ro
    # Loopback only, like the Airflow UI; 8502 on the host, the original's dashboard has 8501.
    ports:
      - "127.0.0.1:8502:8501"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  airflow-db:
  airflow-logs:

secrets:
  snowflake_loader_key:
    file: ${SNOWFLAKE_KEYS_DIR:?set SNOWFLAKE_KEYS_DIR in .env}/crypto_loader_rsa_key.p8
  snowflake_dbt_key:
    file: ${SNOWFLAKE_KEYS_DIR:?set SNOWFLAKE_KEYS_DIR in .env}/crypto_dbt_rsa_key.p8
  snowflake_reporter_key:
    file: ${SNOWFLAKE_KEYS_DIR:?set SNOWFLAKE_KEYS_DIR in .env}/crypto_reporter_rsa_key.p8
