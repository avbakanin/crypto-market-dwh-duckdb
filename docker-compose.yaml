# Local stack of crypto-market-dwh-duckdb: Airflow (LocalExecutor) and the project's own
# commands, both from the image built by the Dockerfile. The warehouse is one DuckDB file
# on the host (./warehouse): no account, no keys, no secrets of a database.
#
#   docker compose --profile tools build project
#   docker compose up -d                                   # Airflow UI on http://localhost:8090
#   docker compose run --rm project python -m ingestion.check_environment
#   docker compose run --rm project dbt build
#   docker compose --profile dashboard up -d dashboard     # dashboard on http://localhost:8502
#
# Compose reads the repo's .env only to fill in ${...} below; a container gets nothing from
# it unless the variable is listed under `environment:`. Host paths in .env are replaced by
# container paths here.
#
# The landing zone: LANDING_ZONE_DIR on the host (empty: ./data/raw) is mounted at
# /opt/project/data/raw, read-only unless LANDING_ZONE_ACCESS=rw. While the Snowflake
# original owns it (PIPELINE_MODE=follow) it is the original's data/raw and stays read-only:
# this stack cannot write a byte there. LANDING_ZONE_ACCESS=rw goes with PIPELINE_MODE=own
# only (check_environment refuses own without write access).
#
# Only the scheduler runs tasks (LocalExecutor), so only the scheduler and the `project`
# service see the landing zone, the warehouse and data/marts; the API server, the DAG
# processor and postgres never do. One writer of the DuckDB file at a time: the DAG runs one
# task after another (max_active_runs=1), and a command started during a run fails on the
# file's lock instead of corrupting it.
#
# Alerts (dags/alerting) are sent from the scheduler (task callbacks) and the DAG processor
# (run callbacks, callbacks of tasks ended from outside), so those two get the Telegram bot
# and the watchdog URL.
#
# `docker compose config` prints the file with secrets filled in: run it only as
# `docker compose config --quiet`.

# Not crypto-market-dwh: that is the Snowflake original's stack on the same machine.
name: crypto-market-dwh-duckdb

x-project-env: &project-env
  DBT_PROJECT_DIR: /opt/project/dbt
  DBT_PROFILES_DIR: /opt/project/dbt
  DUCKDB_PATH: /opt/project/warehouse/crypto_dwh.duckdb
  LANDING_ZONE_DIR: /opt/project/data/raw
  PIPELINE_MODE: ${PIPELINE_MODE:?set PIPELINE_MODE in .env (follow or own)}

x-project-volumes: &project-volumes
  - ${LANDING_ZONE_DIR:-./data/raw}:/opt/project/data/raw:${LANDING_ZONE_ACCESS:-ro}
  # The warehouse file and its WAL: a cache, rebuilt from the landing zone at any time.
  - ./warehouse:/opt/project/warehouse
  # The mart exports the dashboard reads (ingestion/export_marts.py).
  - ./data/marts:/opt/project/data/marts

# Airflow settings shared by every Airflow component. There is no shared airflow.cfg: a
# container without one writes its own with a random JWT secret, API secret key and Fernet
# key, so these come from .env instead (`:?` stops compose when one is missing rather than
# run with a random or empty value).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}@postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # Links in alerts (a task's log) point to the UI as the host sees it: port 8090.
  AIRFLOW__API__BASE_URL: http://localhost:8090
  # DAGs live with the project code (a copy is baked into the image).
  AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  # The DAG is built by mode (dags/crypto_pipeline.py): the DAG processor parses it and the
  # scheduler runs it, so both must see the same mode.
  PIPELINE_MODE: ${PIPELINE_MODE:?set PIPELINE_MODE in .env (follow or own)}

# Alert channels. `:?` as for the Airflow secrets: an empty value would turn the alerts off
# without a word.
x-alert-env: &alert-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
  PIPELINE_HEARTBEAT_URL: ${PIPELINE_HEARTBEAT_URL:?set PIPELINE_HEARTBEAT_URL in .env}

x-airflow-common: &airflow-common
  # Not crypto-market-dwh:dev - building here would replace the original's image.
  image: crypto-market-dwh-duckdb:dev
  # Airflow components start only after the database is migrated.
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      # Applied only when the volume is first created; changing it in .env later needs
      # ALTER USER inside postgres (or a new volume).
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?set AIRFLOW_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Migrates the metadata database and creates the admin user, then exits. Not the image's
  # _AIRFLOW_DB_MIGRATE/_AIRFLOW_WWW_USER_CREATE: the entrypoint runs those as `... || true`,
  # so a failed migration would still let the other components start. `users create` leaves
  # an existing user as it is.
  airflow-init:
    image: crypto-market-dwh-duckdb:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        airflow users create --role Admin \
          --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Airflow --lastname Admin --email admin@localhost
        airflow version

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    environment:
      <<: *airflow-env
    # Loopback only: the UI is not reachable from the local network. 8090 on the host: the
    # original's UI has 8080.
    ports:
      - "127.0.0.1:8090:8080"
    # Task logs, written by the scheduler and read here for the UI.
    volumes:
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Runs the tasks (LocalExecutor): the only Airflow component with the project's landing
  # zone, warehouse and exports.
  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    environment:
      <<: [*airflow-env, *project-env, *alert-env]
    volumes:
      - airflow-logs:/opt/airflow/logs
      # Development: the repo's DAGs over the baked-in copy, read-only.
      - ./dags:/opt/project/dags:ro
      - ${LANDING_ZONE_DIR:-./data/raw}:/opt/project/data/raw:${LANDING_ZONE_ACCESS:-ro}
      - ./warehouse:/opt/project/warehouse
      - ./data/marts:/opt/project/data/marts
    # Tasks report to the execution API on the API server.
    depends_on:
      <<: *airflow-depends-on
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    environment:
      <<: [*airflow-env, *alert-env]
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./dags:/opt/project/dags:ro
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Runs the project's own commands (ingestion, dbt) without Airflow. Not while a DAG run is
  # going: one writer of the DuckDB file at a time.
  project:
    build:
      context: .
      target: runtime
    image: crypto-market-dwh-duckdb:dev
    profiles: ["tools"]
    # Bypass Airflow's /entrypoint, which turns any command into `airflow ...`; dumb-init
    # still forwards Ctrl+C.
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["bash"]
    working_dir: /opt/project
    environment:
      <<: *project-env
      # The project venv first; Airflow's own venv is not on the path.
      PATH: /opt/project-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes: *project-volumes

  # Read-only dashboard over the newest mart export (dashboard/). No Airflow, no project code
  # but dashboard/: only data/marts, mounted read-only; root filesystem read-only. Profile
  # "dashboard": while the original runs, its dashboard is enough and the VM's memory is
  # shared by two stacks, so `up -d` leaves this one out.
  dashboard:
    build:
      context: .
      target: dashboard
    image: crypto-market-dwh-duckdb-dashboard:dev
    profiles: ["dashboard"]
    environment:
      MARTS_DIR: /data/marts
    volumes:
      - ./data/marts:/data/marts:ro
    # Loopback only, like the Airflow UI; 8502 on the host, the original's dashboard has 8501.
    ports:
      - "127.0.0.1:8502:8501"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  airflow-db:
  airflow-logs:
