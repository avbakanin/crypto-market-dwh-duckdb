# dbt project: RAW (loaded by ingestion/) -> staging -> marts in one DuckDB file.
# Run from the repo root: .env sets DBT_PROJECT_DIR=dbt and DBT_PROFILES_DIR=dbt,
# and dbt loads .env itself. Connection: profiles.yml (no secrets, env vars only).
name: crypto_market_dwh
version: "1.0.0"
profile: crypto_market_dwh
require-dbt-version: ">=1.12.0"

model-paths: ["models"]
# The whitelist and the contract mapping are built by ingestion/ and read by Python too:
# config/ is their single home, dbt loads them from there instead of keeping copies.
seed-paths: ["../config"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  # No telemetry to dbt Labs, no .user.yml cookie next to profiles.yml.
  send_anonymous_usage_stats: false

# DQ log (macros/dq_log.sql): the log table is created before the run if missing,
# and the result of every node is appended after it, whatever the command.
# Off during the port: the macros are still Snowflake SQL; step 10b.5 brings them back.
# on-run-start:
#   - "{{ create_dq_log() }}"
# on-run-end:
#   - "{{ log_dbt_results(results) }}"

models:
  crypto_market_dwh:
    staging:
      +schema: staging
      # Table, rebuilt in full: one CTAS per model per run (seconds); tests
      # and downstream models read a consistent snapshot instead of re-running the dedup.
      +materialized: table
    # Intermediate models live next to staging: one schema less to grant, and they are
    # building blocks of the marts, not a published interface.
    intermediate:
      +schema: staging
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    # Views over the DQ log: they must see the rows the on-run-end hook appends
    # after the models are built.
    dq:
      +schema: dq
      +materialized: view

data_tests:
  crypto_market_dwh:
    # Failing rows of every test go to DQ (the E$ tables of ODI), replaced on each
    # run; their counts over time are in the DQ log (on-run-end hook). Stop tests:
    # a view, free to create and empty unless the test fails. Warn tests override
    # this with a table: a snapshot of the findings that reports read.
    # No `limit`: it caps the stored rows and the failure count alike.
    +schema: dq
    +store_failures_as: view

vars:
  # Pump rule: a 1h close-to-close rise of at least this much. +20 % happened once in a
  # year for the 23 liquid symbols; 5 % gives about 190 episodes on 21 symbols.
  pump_min_return: 0.05
  # Hours before and after an event. Also the episode cooldown: a rise within this many
  # hours of the previous qualifying hour extends the episode instead of starting one.
  pump_window_hours: 24
  # Return z-score baseline: 30 days, at least 7 days of history before it is computed.
  return_zscore_window_hours: 720
  return_zscore_min_hours: 168
  # Volume baseline: 7 days.
  volume_baseline_hours: 168
  # Ordinary hours per pump event and pool in fct_pump_control_window (the profile's
  # comparison): 30 x ~200 events is enough for stable control medians per offset.
  control_hours_per_event: 30

seeds:
  crypto_market_dwh:
    +schema: staging
    # Explicit types: inference would make rates FLOAT and timestamps VARCHAR.
    symbols:
      +column_types:
        symbol: varchar
        base_asset: varchar
        quote_asset: varchar
        avg_quote_volume_30d_usdt: decimal(38, 0)
        quote_volume_24h_usdt: decimal(38, 0)
        first_candle_date: date
        selected_at_utc: timestamptz
    perpetuals:
      +column_types:
        spot_symbol: varchar
        futures_symbol: varchar
        contract_multiplier: decimal(38, 0)
        interest_rate_8h: decimal(38, 8)
        mapped_at_utc: timestamptz
