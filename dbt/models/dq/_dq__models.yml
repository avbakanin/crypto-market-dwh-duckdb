models:
  - name: dq_check_results
    description: >
      Results of the data tests and unit tests per dbt invocation: the DQ report and the
      Streamlit DQ panel read this view. Filter is_latest for the current state of each
      check; failures_relation names the table (warn tests) or view (stop tests) in DQ
      with the failing rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invocation_id, check_unique_id]
    columns:
      - name: check_unique_id
        data_tests: [not_null]
      - name: check_type
        description: generic, singular or unit.
        data_tests:
          - accepted_values:
              arguments:
                values: [generic, singular, unit]
      - name: model_name
        description: >
          The model a generic or unit test checks; for a singular test, the models it
          reads, comma-separated.
      - name: severity
        description: warn or error, lower case; error for unit tests.
        data_tests:
          - accepted_values:
              arguments:
                values: [warn, error]
      - name: status
        description: pass, warn, fail, error or skipped.
        data_tests:
          - accepted_values:
              arguments:
                values: [pass, warn, fail, error, skipped]
      - name: failures
        description: Failing rows; equals the row count of failures_relation (tag dq_log checks it).
      - name: logged_at
        description: When the hook appended the row (the warehouse's clock).
      - name: is_latest
        description: True on the last result of each check.
        data_tests: [not_null]

  - name: dq_data_coverage
    description: >
      How far each extract dataset reaches: rows, symbols, first and last point (moments;
      candles end at open + 1 h) and the newest batch. One row per dataset, also for an
      empty one. The dashboard shows klines_1h's data_to as "data as of".
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "row_count > 0 and symbol_count > 0 and data_from <= data_to"
    columns:
      - name: dataset
        description: Landing-zone name of the dataset (data/raw/<dataset>).
        data_tests: [unique, not_null]
      - name: data_to
        description: Last point of the series; for candles the close of the last hour.
