version: 2

# Unit tests of the intermediate SQL on hand-made rows. Inputs are models with typed
# columns, so dict fixtures are enough (format: sql is needed only for JSON payloads);
# unlisted columns are NULL. Windows are shrunk through vars to keep fixtures small.
# Prices are chosen so that returns and z-scores are exact in binary and decimal.

unit_tests:
  - name: returns_skip_holes_and_baselines_exclude_current_hour
    description: >
      BTCUSDT has hours 00-04 and 06 (05 missing). No return across the hole, a 4h return
      only when the row 4 back is 4 hours back. The z-score waits for 2 returns, its
      window (3 rows) ends before the current hour. The volume baseline needs a full window
      of 2 rows. ETHUSDT's first row has no return although BTC rows precede it.
    model: int_binance__hourly_returns
    overrides:
      vars:
        return_zscore_window_hours: 3
        return_zscore_min_hours: 2
        volume_baseline_hours: 2
    given:
      - input: ref('stg_binance__klines_1h')
        rows:
          - {symbol: BTCUSDT, open_time_ms: 1735689600000, close_price: 100, quote_volume: 100}
          - {symbol: BTCUSDT, open_time_ms: 1735693200000, close_price: 150, quote_volume: 100}
          - {symbol: BTCUSDT, open_time_ms: 1735696800000, close_price: 75, quote_volume: 400}
          - {symbol: BTCUSDT, open_time_ms: 1735700400000, close_price: 75, quote_volume: 100}
          - {symbol: BTCUSDT, open_time_ms: 1735704000000, close_price: 112.5, quote_volume: 100}
          - {symbol: BTCUSDT, open_time_ms: 1735711200000, close_price: 100, quote_volume: 100}
          - {symbol: ETHUSDT, open_time_ms: 1735711200000, close_price: 3, quote_volume: 50}
    expect:
      rows:
        - {symbol: BTCUSDT, open_time_ms: 1735689600000, return_1h: null, return_4h: null,
           return_zscore: null, return_baseline_hours: 0, quote_volume_baseline: null}
        - {symbol: BTCUSDT, open_time_ms: 1735693200000, return_1h: 0.5, return_4h: null,
           return_zscore: null, return_baseline_hours: 0, quote_volume_baseline: null}
        - {symbol: BTCUSDT, open_time_ms: 1735696800000, return_1h: -0.5, return_4h: null,
           return_zscore: null, return_baseline_hours: 1, quote_volume_baseline: 100}
        - {symbol: BTCUSDT, open_time_ms: 1735700400000, return_1h: 0, return_4h: null,
           return_zscore: 0, return_baseline_hours: 2, quote_volume_baseline: 250}
        - {symbol: BTCUSDT, open_time_ms: 1735704000000, return_1h: 0.5, return_4h: 0.125,
           return_zscore: 1, return_baseline_hours: 3, quote_volume_baseline: 250}
        - {symbol: BTCUSDT, open_time_ms: 1735711200000, return_1h: null, return_4h: null,
           return_zscore: null, return_baseline_hours: 3, quote_volume_baseline: 100}
        - {symbol: ETHUSDT, open_time_ms: 1735711200000, return_1h: null, return_4h: null,
           return_zscore: null, return_baseline_hours: 0, quote_volume_baseline: null}

  - name: market_as_of_funding_and_open_interest_at_hour_end
    description: >
      ENAUSDT, a 4-hour contract that missed the 04:00 settlement. Each row is the state at
      the end of its hour: open interest snapshot at hour_end, the last settlement at or
      before hour_end (a settlement exactly at hour_end counts). Before the first settlement
      funding is NULL. A due settlement that is not there makes the row stale. Funding is
      normalised to 8 h and compared with the contract's calm rate. BTCUSDT's older
      settlement must not be replaced by ENA's newer one (the ON clause).
    model: int_binance__hourly_market
    given:
      - input: ref('int_binance__hourly_returns')
        rows:
          - {symbol: ENAUSDT, open_time_ms: 1735682400000}
          - {symbol: ENAUSDT, open_time_ms: 1735686000000}
          - {symbol: ENAUSDT, open_time_ms: 1735696800000}
          - {symbol: ENAUSDT, open_time_ms: 1735700400000}
          - {symbol: ENAUSDT, open_time_ms: 1735714800000}
          - {symbol: BTCUSDT, open_time_ms: 1735696800000}
      - input: ref('stg_binance__open_interest_1h')
        rows:
          - {spot_symbol: ENAUSDT, snapshot_time_ms: 1735686000000, open_interest_coins: 900}
          - {spot_symbol: ENAUSDT, snapshot_time_ms: 1735689600000, open_interest_coins: 1000}
      - input: ref('stg_binance__long_short_ratio_1h')
        rows:
          - {spot_symbol: ENAUSDT, ratio_series: top_account, snapshot_time_ms: 1735686000000,
             long_short_ratio: 2.0}
          - {spot_symbol: ENAUSDT, ratio_series: global_account, snapshot_time_ms: 1735686000000,
             long_short_ratio: 1.5}
          - {spot_symbol: ENAUSDT, ratio_series: top_position, snapshot_time_ms: 1735689600000,
             long_short_ratio: 1.2}
      - input: ref('stg_binance__funding_rate')
        rows:
          - {spot_symbol: ENAUSDT, funding_hour_ms: 1735689600000, funding_rate: 0.00005,
             interval_hours: 4, interest_rate_8h: 0.0001}
          - {spot_symbol: ENAUSDT, funding_hour_ms: 1735718400000, funding_rate: 0.0002,
             interval_hours: 4, interest_rate_8h: 0.0001}
          - {spot_symbol: BTCUSDT, funding_hour_ms: 1735660800000, funding_rate: 0.0001,
             interval_hours: 8, interest_rate_8h: 0.0001}
    expect:
      rows:
        - {symbol: ENAUSDT, open_time_ms: 1735682400000, open_interest_coins: 900,
           top_account_long_short_ratio: 2.0, top_position_long_short_ratio: null,
           global_account_long_short_ratio: 1.5,
           funding_rate: null, funding_rate_8h: null, funding_premium_8h: null,
           hours_since_funding: null, is_funding_stale: null}
        - {symbol: ENAUSDT, open_time_ms: 1735686000000, open_interest_coins: 1000,
           top_account_long_short_ratio: null, top_position_long_short_ratio: 1.2,
           global_account_long_short_ratio: null,
           funding_rate: 0.00005, funding_rate_8h: 0.0001, funding_premium_8h: 0,
           hours_since_funding: 0, is_funding_stale: false}
        - {symbol: ENAUSDT, open_time_ms: 1735696800000, open_interest_coins: null,
           top_account_long_short_ratio: null, top_position_long_short_ratio: null,
           global_account_long_short_ratio: null,
           funding_rate: 0.00005, funding_rate_8h: 0.0001, funding_premium_8h: 0,
           hours_since_funding: 3, is_funding_stale: false}
        - {symbol: ENAUSDT, open_time_ms: 1735700400000, open_interest_coins: null,
           top_account_long_short_ratio: null, top_position_long_short_ratio: null,
           global_account_long_short_ratio: null,
           funding_rate: 0.00005, funding_rate_8h: 0.0001, funding_premium_8h: 0,
           hours_since_funding: 4, is_funding_stale: true}
        - {symbol: ENAUSDT, open_time_ms: 1735714800000, open_interest_coins: null,
           top_account_long_short_ratio: null, top_position_long_short_ratio: null,
           global_account_long_short_ratio: null,
           funding_rate: 0.0002, funding_rate_8h: 0.0004, funding_premium_8h: 0.0003,
           hours_since_funding: 0, is_funding_stale: false}
        - {symbol: BTCUSDT, open_time_ms: 1735696800000, open_interest_coins: null,
           top_account_long_short_ratio: null, top_position_long_short_ratio: null,
           global_account_long_short_ratio: null,
           funding_rate: 0.0001, funding_rate_8h: 0.0001, funding_premium_8h: 0,
           hours_since_funding: 11, is_funding_stale: true}
