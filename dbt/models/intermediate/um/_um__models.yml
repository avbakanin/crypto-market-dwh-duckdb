version: 2

models:
  - name: int_um__universe_daily
    description: >
      Point-in-time universe of USD-M perpetuals: per day, every eligible contract with its
      quote turnover over D-31 .. D-2 and its rank; members are the top um_universe_size.
      ingestion/universe.py reads it to choose what to extract.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [universe_date, symbol]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [universe_date, turnover_rank]
    columns:
      - name: turnover_30d
        data_tests: [not_null]
      - name: is_member
        data_tests: [not_null]

  - name: int_um__klines_1h
    description: >
      USD-M hourly candles of the universe: archive where it has the hour, API after.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, open_time_ms]
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [archive, api]

  - name: int_um__funding_rate
    description: >
      USD-M funding settlements of the universe: archive (to the last full month), API after.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contract_symbol, funding_hour_ms]

  - name: int_um__metrics_1h
    description: >
      USD-M hourly open interest and long/short ratios of the universe: archive where it
      has the hour, API after.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contract_symbol, snapshot_time_ms]

  - name: int_um__daily_bars
    description: >
      Daily bars (UTC) of the USD-M universe from the hourly series: OHLC, volumes, hours
      present, realized variance of hourly log returns, the day's funding, open interest
      at the day's last snapshot and the day's average long/short ratios.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
    columns:
      - name: close_price
        data_tests: [not_null]
      - name: hours_present
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24

  - name: int_um__features_daily
    description: >
      Daily features per (decision_date D, member of D), from days up to D-1 only:
      momentum, trend, volatility, turnover and taker flow, funding, open interest,
      long/short, strength against BTC and the members, breadth. NULL where the window
      lacks days or the metric did not exist yet. docs/features_and_labels.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [decision_date, symbol]
    columns:
      - name: feature_date
        description: D-1, the day the features read up to; NULL without a bar on D-1.
      - name: hours_feature_day
        data_tests: [not_null]
      - name: history_days
        data_tests: [not_null]

  - name: int_um__liquidations_daily
    description: >
      USD-M liquidations per (contract, UTC day) from the stream (a lower bound), with the
      day's stream coverage in minutes (1440 = complete).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contract_symbol, liquidation_date]
    columns:
      - name: coverage_minutes
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1440

unit_tests:
  - name: universe_ranks_by_the_past_only
    description: >
      Ranks on day D use the 30 days D-31 .. D-2 only. BUSDT turns over 1e9 on day 30: on
      day 31 (window days 0..29) AUSDT still ranks first; on day 32 BUSDT leads alone
      (AUSDT has no day 30). A pegged contract, an excluded index and a TradFi contract
      never rank. A mutant
      whose window reaches D-1 or D ranks BUSDT first on day 31 and fails.
    model: int_um__universe_daily
    overrides:
      vars:
        um_universe_size: 1
    given:
      - input: ref('stg_binance__um_archive_klines_1d')
        format: sql
        rows: |
          select
              s.symbol,
              (timestamptz '2026-01-01 00:00:00+00' + to_days(i::integer)) as open_time,
              (timestamptz '2026-01-01 23:59:59.999+00' + to_days(i::integer)) as close_time,
              s.price::decimal(38, 8) as open_price,
              s.price::decimal(38, 8) as high_price,
              s.price::decimal(38, 8) as low_price,
              s.price::decimal(38, 8) as close_price,
              1::decimal(38, 8) as base_volume,
              (case when s.symbol = 'BUSDT' and i = 30 then 1e9 else s.volume end)::decimal(38, 8)
                  as quote_volume,
              10::bigint as trade_count,
              0::decimal(38, 8) as taker_buy_base_volume,
              0::decimal(38, 8) as taker_buy_quote_volume,
              epoch_ms(timestamptz '2026-01-01 00:00:00+00') + i * 86400000 as open_time_ms,
              epoch_ms(timestamptz '2026-01-01 00:00:00+00') + i * 86400000 + 86399999
                  as close_time_ms,
              '20261127T000000Z' as _batch_id,
              timestamptz '2026-11-27 00:00:00+00' as _loaded_at
          from (values
              ('AUSDT', 5.0, 100, 30),
              ('BUSDT', 5.0, 50, 31),
              ('CUSDT', 1.0, 1e6, 31),
              ('DEFIUSDT', 5.0, 1e6, 31),
              ('XAUUSDT', 5.0, 1e6, 31)
          ) as s(symbol, price, volume, days),
          range(31) as r(i)
          where i < s.days
      - input: ref('um_universe_exclusions')
        rows:
          - {symbol: DEFIUSDT, reason: index}
      - input: ref('stg_binance__um_contracts')
        rows:
          - {contract_symbol: XAUUSDT, contract_type: TRADIFI_PERPETUAL, underlying_type: COMMODITY}
          - {contract_symbol: AUSDT, contract_type: PERPETUAL, underlying_type: COIN}
    expect:
      rows:
        - {universe_date: 2026-02-01, symbol: AUSDT, turnover_rank: 1, is_member: true}
        - {universe_date: 2026-02-01, symbol: BUSDT, turnover_rank: 2, is_member: false}
        - {universe_date: 2026-02-02, symbol: BUSDT, turnover_rank: 1, is_member: true}

  - name: stitched_klines_prefer_the_archive
    description: The archive's hour wins; the API fills only the hours after it.
    model: int_um__klines_1h
    given:
      - input: ref('stg_binance__um_archive_klines_1h')
        rows:
          - {symbol: BTCUSDT, open_time_ms: 0, close_price: 1}
      - input: ref('stg_binance__um_api_klines_1h')
        rows:
          - {symbol: BTCUSDT, open_time_ms: 0, close_price: 2}
          - {symbol: BTCUSDT, open_time_ms: 3600000, close_price: 3}
          - {symbol: ETHUSDT, open_time_ms: 0, close_price: 4}
    expect:
      rows:
        - {symbol: BTCUSDT, open_time_ms: 0, close_price: 1, source: archive}
        - {symbol: BTCUSDT, open_time_ms: 3600000, close_price: 3, source: api}
        - {symbol: ETHUSDT, open_time_ms: 0, close_price: 4, source: api}

  - name: features_read_the_past_only
    description: >
      Features of D read days up to D-1 only. 69 calm days (2026-01-01 .. 03-10: price
      constant, high/low +-25 %, realized variance 0.25, taker half, funding 0.0003 a day)
      are followed by 7 days from D on with every input changed (price x10, variance 4,
      funding 0.01, open interest x10, long/short x2). The features of D equal those of the
      calm days. A mutant whose window reaches a day ahead (lead, a following frame, D's own
      bar) fails.
    model: int_um__features_daily
    given:
      - input: ref('int_um__daily_bars')
        format: sql
        rows: |
          select
              s.symbol,
              date '2026-01-01' + r.i::integer as trade_date,
              (s.base * m.k)::decimal(38, 8) as open_price,
              (s.base * m.k * 1.25)::decimal(38, 8) as high_price,
              (s.base * m.k * 0.75)::decimal(38, 8) as low_price,
              (s.base * m.k)::decimal(38, 8) as close_price,
              (1000 * m.k)::decimal(38, 8) as quote_volume,
              (case when r.i < 69 then 500 else 9000 end)::decimal(38, 8)
                  as taker_buy_quote_volume,
              100::bigint as trade_count,
              24::bigint as hours_present,
              (case when r.i < 69 then 0.25 else 4 end)::double as realized_var,
              (case when r.i < 69 then 0.0003 else 0.01 end)::decimal(38, 8) as funding_sum,
              3::bigint as funding_count,
              (1e6 * m.k)::decimal(38, 8) as oi_usdt_eod,
              null::timestamptz as oi_snapshot_time,
              (case when r.i < 69 then 1.5 else 3 end)::double as global_ls,
              1.2::double as top_position_ls,
              1.1::double as top_account_ls
          from (values ('AUSDT', 100), ('BTCUSDT', 200)) as s(symbol, base),
              range(76) as r(i),
              lateral (select case when r.i < 69 then 1 else 10 end as k) as m
      - input: ref('int_um__universe_daily')
        rows:
          - {universe_date: 2026-03-11, symbol: BTCUSDT, turnover_30d: 1, turnover_rank: 1, is_member: true}
          - {universe_date: 2026-03-11, symbol: AUSDT, turnover_30d: 1, turnover_rank: 2, is_member: true}
    expect:
      rows:
        - &calm
          decision_date: 2026-03-11
          symbol: BTCUSDT
          feature_date: 2026-03-10
          ret_1d: 0
          ret_60d: 0
          close_to_sma50: 0
          rv_7d: 0.5
          rv_30d: 0.5
          atr_14d_pct: 0.5
          taker_buy_share_7d: 0.5
          funding_1d: 0.0003
          funding_7d: 0.0021
          oi_chg_7d: 0
          global_ls_chg_7d: 0
          rel_btc_ret_30d: 0
          ret_7d_rank_pct: 0
          history_days: 69
          hours_feature_day: 24
        - <<: *calm
          symbol: AUSDT

  - name: liquidations_daily_split_sides_and_carry_coverage
    description: >
      SELL orders are long liquidations, BUY short ones; a day's coverage sums its hours;
      a day with liquidations but no stream records has coverage 0.
    model: int_um__liquidations_daily
    given:
      - input: ref('stg_binance__um_liquidations')
        rows:
          - {contract_symbol: BTCUSDT, trade_time: "2026-11-28 01:00:00+00", liquidated_side: long, notional_usdt: 100}
          - {contract_symbol: BTCUSDT, trade_time: "2026-11-28 23:59:59+00", liquidated_side: long, notional_usdt: 50}
          - {contract_symbol: BTCUSDT, trade_time: "2026-11-28 02:00:00+00", liquidated_side: short, notional_usdt: 7}
          - {contract_symbol: ETHUSDT, trade_time: "2026-11-29 00:00:00+00", liquidated_side: short, notional_usdt: 3}
      - input: ref('stg_binance__um_liquidation_stream')
        rows:
          - {stream_hour: "2026-11-28 01:00:00+00", connected_minutes: 60}
          - {stream_hour: "2026-11-28 02:00:00+00", connected_minutes: 45}
    expect:
      rows:
        - {contract_symbol: BTCUSDT, liquidation_date: 2026-11-28, long_liquidated_usdt: 150, short_liquidated_usdt: 7, long_liquidations: 2, short_liquidations: 1, coverage_minutes: 105}
        - {contract_symbol: ETHUSDT, liquidation_date: 2026-11-29, long_liquidated_usdt: 0, short_liquidated_usdt: 3, long_liquidations: 0, short_liquidations: 1, coverage_minutes: 0}
