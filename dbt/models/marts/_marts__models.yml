version: 2

models:
  - name: dim_symbol
    description: >
      Whitelisted spot symbols with their USD-M perpetual contract. Type 1: the seeds are
      snapshots without history (selection volumes, multiplier, interest rate).
    columns:
      - name: symbol
        data_tests: [unique, not_null]
      - name: base_asset
        data_tests: [not_null]
      - name: futures_symbol
        description: The perpetual contract (1000PEPEUSDT); NULL when the symbol has none.
        data_tests: [unique]
      - name: contract_multiplier
        description: Coins per contract unit; NULL without a perpetual.
      - name: interest_rate_8h
        description: Base funding rate per 8 h (0.0001 for most, 0 for BNBUSDT).
      - name: has_perpetual
        data_tests: [not_null]
      - name: avg_quote_volume_30d_usdt
        description: Selection input as of selected_at_utc, not a current fact.

  - name: fct_pump_events
    description: >
      One row per pump episode: the first hour of a run of 1h close-to-close rises of at
      least pump_min_return (5 %), qualifying hours within pump_window_hours (24) of each
      other being one episode. Metrics over pump_window_hours before and after the event,
      NULL where the loaded history has no full window.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, event_open_time_ms]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "return_1h >= {{ var('pump_min_return') }}"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "episode_hours >= 1 and market_breadth >= 1"
    columns:
      - name: pump_event_id
        description: Surrogate key of (symbol, event_open_time_ms).
        data_tests: [unique, not_null]
      - name: symbol
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_symbol')
                field: symbol
      - name: event_hour
        description: Open time of the first qualifying hour.
        data_tests: [not_null]
      - name: episode_hours
        description: Qualifying hours in the episode.
      - name: overlaps_previous_event
        description: The previous event of the symbol is within 2 * pump_window_hours.
        data_tests: [not_null]
      - name: market_breadth
        description: Symbols, this one included, past the threshold in the same hour.
      - name: event_scope
        description: >
          single_coin (market_breadth = 1) or multi_coin (a market move); the scopes of
          mart_pump_profile and the dashboard's filter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [single_coin, multi_coin]
      - name: has_full_before_window
        data_tests: [not_null]
      - name: has_full_after_window
        data_tests: [not_null]
      - name: has_full_open_interest_window
        description: Open interest in every hour of both windows (history ~30 days).
        data_tests: [not_null]
      - name: return_before
        description: Price change over the window before the event start.
      - name: return_after
        description: Price change over the window after the event hour closed.
      - name: volume_ratio_event
        description: Event hour quote volume / mean of the 7 days before.
      - name: open_interest_change_event
        description: Open interest change in coins during the event hour.
      - name: funding_rate_8h_before
        description: Funding per 8 h in force at the event start.

  - name: fct_pump_event_window
    description: >
      One row per (pump event, offset) from -pump_window_hours to +pump_window_hours:
      the hourly profile around each event. Values relative to the event start (end of
      hour -1); hours outside the loaded history are NULL. Measured by the macro
      pump_window, like the ordinary hours of fct_pump_control_window.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pump_event_id, offset_hours]
      # The start is the end of hour -1: every change "since start" is 0 there.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "offset_hours <> -1 or return_since_start = 0"
      # The anchor hour's own close is the base of the "after" return.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "offset_hours <> 0 or return_since_anchor_close = 0"
    columns:
      - name: pump_event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_pump_events')
                field: pump_event_id
      - name: offset_hours
        data_tests: [not_null]
      - name: return_since_anchor_close
        description: >
          Close against the close of the event hour (offset 0): what an entry at the end of
          the pump hour would have seen.
      - name: taker_buy_share
        description: Taker buy share of the hour's quote volume (about 0.5 normally).
      - name: top_position_ratio_change_since_start
        description: >
          Top traders' long/short position ratio relative to the start; also for the top
          account and global account ratios. History ~30 days: NULL before.

  - name: fct_pump_control_window
    description: >
      Ordinary hours of the same symbol per pump event, measured exactly like
      fct_pump_event_window (macro pump_window): the comparison for the profile. No hour
      of the symbol past the pump threshold within 2 * pump_window_hours rows; two pools
      of control_hours_per_event each, picked by a hash of (event, hour): year (any
      candidate) and recent (open interest and long/short in every hour of the window).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pump_event_id, control_open_time_ms, offset_hours]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_year_control or is_recent_control"
      # An ordinary hour's window has no qualifying hour, or it would be a pump window.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(return_1h, 0) < {{ var('pump_min_return') }}"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "offset_hours <> -1 or return_since_start = 0"
      # The recent pool exists for the futures metrics: they must be there.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              not is_recent_control
              or (open_interest_change_since_start is not null
              and top_position_ratio_change_since_start is not null)
    columns:
      - name: pump_event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_pump_events')
                field: pump_event_id
      - name: control_open_time_ms
        description: Open time of the control hour (offset 0 of its window).
        data_tests: [not_null]
      - name: is_year_control
        description: In the year pool (price, volume, taker share, funding).
        data_tests: [not_null]
      - name: is_recent_control
        description: In the recent pool (open interest, long/short ratios).
        data_tests: [not_null]
      - name: offset_hours
        data_tests: [not_null]

  - name: mart_pump_profile
    description: >
      The pump profile against ordinary hours, one row per (event scope, offset, metric):
      event median and quartiles, the median of the same events' control hours and the
      median per-event excess over its own controls. Scopes: all and the event_scope of
      fct_pump_events (single_coin, multi_coin). The dashboard reads it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_scope, offset_hours, metric]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "events >= 1 and control_hours >= 0"
      # At the start both sides are 0 by construction.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              metric <> 'return_since_start' or offset_hours <> -1
              or (event_median = 0 and control_median = 0 and median_excess = 0)
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              metric <> 'return_since_anchor_close' or offset_hours <> 0
              or (event_median = 0 and control_median = 0 and median_excess = 0)
    columns:
      - name: event_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [all, single_coin, multi_coin]
      - name: offset_hours
        data_tests: [not_null]
      - name: metric
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - return_since_start
                  - return_since_anchor_close
                  - volume_ratio
                  - taker_buy_share
                  - funding_premium_8h
                  - open_interest_change_since_start
                  - top_account_ratio_change_since_start
                  - top_position_ratio_change_since_start
                  - global_account_ratio_change_since_start
      - name: events
        description: Events with a value of the metric at this offset.
      - name: control_hours
        description: Control hours of those events with a value (matched pool).
      - name: median_excess
        description: Median over events of (event value - median of its own controls).

  - name: fct_pump_event_excess
    description: >
      Each pump event against its own ordinary hours, one row per (event, offset, metric)
      with a value: the event's value, the median and the shares above / below zero of its
      control hours (the metric's pool in fct_pump_control_window, same offset) and
      excess = value - control median. The per-event numbers behind mart_pump_profile;
      exported so that the analysis can resample event days for confidence intervals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pump_event_id, offset_hours, metric]
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              control_hours between 0 and {{ var('control_hours_per_event') }}
              and (control_hours = 0) = (excess is null)
              and control_share_above_zero + control_share_below_zero <= 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              metric <> 'return_since_start' or offset_hours <> -1
              or (value = 0 and excess = 0)
    columns:
      - name: pump_event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_pump_events')
                field: pump_event_id
      - name: offset_hours
        data_tests: [not_null]
      - name: metric
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - return_since_start
                  - return_since_anchor_close
                  - volume_ratio
                  - taker_buy_share
                  - funding_premium_8h
                  - open_interest_change_since_start
                  - top_account_ratio_change_since_start
                  - top_position_ratio_change_since_start
                  - global_account_ratio_change_since_start
      - name: value
        data_tests: [not_null]
      - name: control_hours
        description: The event's control hours with a value of the metric at this offset.
        data_tests: [not_null]
      - name: excess
        description: value - control_median; NULL when the event has no control value.

  - name: mart_pump_signal_check
    description: >
      Does an hour that looks like a pre-pump hour predict a pump in the next hour? One
      row per (rule, UTC day of hour t): hours where the rule held (with a volume
      baseline and an hour right after) and how many were followed by an hour rising past
      pump_min_return. every_hour is the base rate. Precision = followed / hours, lift =
      precision / base rate, recall = followed / every_hour's followed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rule, signal_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "signal_hours >= 1 and followed_by_pump between 0 and signal_hours"
    columns:
      - name: rule
        description: >
          every_hour; volume_1_5x / volume_2x (quote volume over the 7-day baseline);
          volume_2x_flat_price (and |return_1h| < 2 %); volume_3x_rising_below_threshold
          (and 0 <= return_1h < pump_min_return).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - every_hour
                  - volume_1_5x
                  - volume_2x
                  - volume_2x_flat_price
                  - volume_3x_rising_below_threshold
      - name: signal_date
        data_tests: [not_null]
      - name: signal_hours
        data_tests: [not_null]
      - name: followed_by_pump
        data_tests: [not_null]

  - name: fct_um_forward_returns
    description: >
      Labels of the USD-M universe: per (decision_date, member, horizon) the return of a
      long and a short entered at D 01:00 UTC and held the horizon, after taker fees,
      slippage and funding, with the adverse and favourable excursions and whether 3/5/10x
      leverage survives. Only horizons the archive has covered. docs/features_and_labels.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [decision_date, symbol, horizon_days]
    columns:
      - name: exit_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [horizon, delisted]
      - name: exit_price
        data_tests: [not_null]
      - name: gross_return
        data_tests: [not_null]
      - name: cost_return
        description: Round trip (two sides) of taker fee and slippage, a fraction.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0014
                max_value: 0.05
      - name: mae_long
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                max_value: 0
      - name: mfe_long
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: mae_short
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                max_value: 0
      - name: mfe_short
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_signal_log
    description: >
      The forward test's decisions with outcomes, one row per (decision day, version): the
      logged trade (pick, BTCUSDT hedge, stop) and, once the labels cover its horizon, its
      net after costs and funding, MAE, exposure and excess over the day's random member.
      docs/forward_test.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [decision_date, version]
    columns:
      - name: outcome_status
        data_tests:
          - accepted_values:
              arguments:
                values: [open, closed]
      - name: net_return
        description: Net of the pair per unit of the pick's notional; set once closed.
        data_tests:
          - not_null:
              config:
                where: "outcome_status = 'closed'"
      - name: mae
        data_tests:
          - not_null:
              config:
                where: "outcome_status = 'closed'"
      - name: exit_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [horizon, delisted, stop]

  - name: mart_signal_performance
    description: >
      Forward-test results per registered version: logged, missed and traded days, open
      and closed trades, hit rate, mean net with a normal 95 % interval, excess, survival
      of 3x leverage, and whether the criteria to drop the paper mark are met.
    columns:
      - name: version
        data_tests: [unique, not_null]
