version: 2

# Unit tests of the event logic on hand-made market hours (window shrunk to 2 hours).
# BTCUSDT hours 00-12 (offsets below are hours after 2025-01-01 00:00 UTC):
#   03 return 0.05   -> event 1: exactly the threshold qualifies
#   06 return 0.10   -> event 2: 3 h after 03 (> window), overlaps event 1 (3 <= 2 * window)
#   08 return 0.06   -> extends event 2: exactly window hours after 06
#   09 return 0.0499 -> below the threshold
#   12 return 0.20   -> event 3: last hour of history, no full after-window
# ETHUSDT has only hour 06 (return 0.08): its own event, and breadth 2 at 06.
# DuckDB divides decimals in DOUBLE (source note 109): expected ratios are exact in binary
# (0.125, not 0.1).

unit_tests:
  - name: pump_episodes_threshold_cooldown_and_windows
    description: >
      Threshold boundary, episode extension at exactly the cooldown, overlap of windows,
      breadth across symbols, edges of history, and metrics read from the right side of
      the event (before = rows -3..-1 / -2..-1, after = rows +1..+2).
    model: fct_pump_events
    overrides:
      vars:
        pump_min_return: 0.05
        pump_window_hours: 2
    given:
      - input: ref('int_binance__hourly_market')
        rows:
          - {symbol: BTCUSDT, open_time_ms: 1735689600000, return_1h: 0, close_price: 80, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735693200000, return_1h: 0, close_price: 85, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735696800000, return_1h: 0, close_price: 90, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735700400000, return_1h: 0.05, close_price: 100, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001, open_interest_coins: 900}
          - {symbol: BTCUSDT, open_time_ms: 1735704000000, return_1h: 0, close_price: 104, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001, open_interest_coins: 950}
          - {symbol: BTCUSDT, open_time_ms: 1735707600000, return_1h: 0, close_price: 112.5, quote_volume: 200, quote_volume_baseline: 100, funding_rate_8h: 0.0003, open_interest_coins: 1000}
          - {symbol: BTCUSDT, open_time_ms: 1735711200000, return_1h: 0.10, close_price: 120, quote_volume: 300, quote_volume_baseline: 100, funding_rate_8h: 0.0001, open_interest_coins: 1125}
          - {symbol: BTCUSDT, open_time_ms: 1735714800000, return_1h: 0, close_price: 125, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001, open_interest_coins: 1200}
          - {symbol: BTCUSDT, open_time_ms: 1735718400000, return_1h: 0.06, close_price: 150, quote_volume: 400, quote_volume_baseline: 100, funding_rate_8h: 0.0005, open_interest_coins: 1210}
          - {symbol: BTCUSDT, open_time_ms: 1735722000000, return_1h: 0.0499, close_price: 128, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735725600000, return_1h: 0, close_price: 126, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735729200000, return_1h: 0, close_price: 124, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: BTCUSDT, open_time_ms: 1735732800000, return_1h: 0.20, close_price: 150, quote_volume: 100, quote_volume_baseline: 100, funding_rate_8h: 0.0001}
          - {symbol: ETHUSDT, open_time_ms: 1735711200000, return_1h: 0.08, close_price: 3, quote_volume: 100}
    expect:
      rows:
        - {symbol: BTCUSDT, event_open_time_ms: 1735700400000, episode_hours: 1,
           overlaps_previous_event: false, market_breadth: 1, event_scope: single_coin,
           has_full_before_window: true, has_full_after_window: true,
           has_full_open_interest_window: false,
           return_before: 0.125, return_after: 0.125,
           volume_ratio_event: 1, volume_ratio_before: 1, volume_ratio_after: 1.5,
           open_interest_change_event: null,
           funding_rate_8h_before: 0.0001, funding_rate_8h_max_after: 0.0003}
        - {symbol: BTCUSDT, event_open_time_ms: 1735711200000, episode_hours: 2,
           overlaps_previous_event: true, market_breadth: 2, event_scope: multi_coin,
           has_full_before_window: true, has_full_after_window: true,
           has_full_open_interest_window: true,
           return_before: 0.125, return_after: 0.25,
           volume_ratio_event: 3, volume_ratio_before: 1.5, volume_ratio_after: 2.5,
           open_interest_change_event: 0.125,
           funding_rate_8h_before: 0.0003, funding_rate_8h_max_after: 0.0005}
        - {symbol: BTCUSDT, event_open_time_ms: 1735732800000, episode_hours: 1,
           overlaps_previous_event: false, market_breadth: 1, event_scope: single_coin,
           has_full_before_window: true, has_full_after_window: false,
           has_full_open_interest_window: false,
           return_before: -0.03125, return_after: null,
           volume_ratio_event: 1, volume_ratio_before: 1, volume_ratio_after: null,
           open_interest_change_event: null,
           funding_rate_8h_before: 0.0001, funding_rate_8h_max_after: null}
        - {symbol: ETHUSDT, event_open_time_ms: 1735711200000, episode_hours: 1,
           overlaps_previous_event: false, market_breadth: 2, event_scope: multi_coin,
           has_full_before_window: false, has_full_after_window: false,
           has_full_open_interest_window: false,
           return_before: null, return_after: null,
           volume_ratio_event: null, volume_ratio_before: null, volume_ratio_after: null,
           open_interest_change_event: null,
           funding_rate_8h_before: null, funding_rate_8h_max_after: null}

  - name: control_hours_are_ordinary_hours_of_the_event_symbol
    description: >
      Window shrunk to 1 hour, so a candidate needs rows -2 and +1 and no qualifying hour
      within 2 rows. AAA hours 00-11 (offsets: hours after 2025-01-01 00:00 UTC): 06
      rises 6 % (rules out 04-08), 03 has no volume baseline, 00, 01 and 11 lack a full
      window -> controls 02, 09, 10. Open interest and long/short exist from 05, so only
      09 and 10 have a full futures window (recent pool). BBB (00-08) rises at 02, which
      must not rule out AAA's 02, and has candidates of its own (05-07), which must not
      become AAA's controls. Changes since the
      start are against the end of hour -1 (AAA 10 closes at 125).
    model: fct_pump_control_window
    overrides:
      vars:
        pump_min_return: 0.05
        pump_window_hours: 1
        control_hours_per_event: 10
    given:
      - input: ref('fct_pump_events')
        rows:
          - {pump_event_id: e1, symbol: AAA}
      - input: ref('int_binance__hourly_market')
        rows:
          - {symbol: AAA, open_time_ms: 1735689600000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735693200000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735696800000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735700400000, return_1h: 0, close_price: 100, quote_volume_baseline: null}
          - {symbol: AAA, open_time_ms: 1735704000000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735707600000, return_1h: 0, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735711200000, return_1h: 0.06, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735714800000, return_1h: 0, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735718400000, return_1h: 0, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735722000000, return_1h: 0, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735725600000, return_1h: 0, close_price: 125, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: AAA, open_time_ms: 1735729200000, return_1h: 0, close_price: 100, quote_volume_baseline: 1, open_interest_coins: 1000, top_position_long_short_ratio: 2}
          - {symbol: BBB, open_time_ms: 1735689600000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735693200000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735696800000, return_1h: 0.07, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735700400000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735704000000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735707600000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735711200000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735714800000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735718400000, return_1h: 0, close_price: 100, quote_volume_baseline: 1}
    expect:
      rows:
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735696800000, offset_hours: -1, is_year_control: true, is_recent_control: false, return_since_start: 0, open_interest_change_since_start: null}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735696800000, offset_hours: 0, is_year_control: true, is_recent_control: false, return_since_start: 0, open_interest_change_since_start: null}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735696800000, offset_hours: 1, is_year_control: true, is_recent_control: false, return_since_start: 0, open_interest_change_since_start: null}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735722000000, offset_hours: -1, is_year_control: true, is_recent_control: true, return_since_start: 0, open_interest_change_since_start: 0}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735722000000, offset_hours: 0, is_year_control: true, is_recent_control: true, return_since_start: 0, open_interest_change_since_start: 0}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735722000000, offset_hours: 1, is_year_control: true, is_recent_control: true, return_since_start: 0.25, open_interest_change_since_start: 0}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735725600000, offset_hours: -1, is_year_control: true, is_recent_control: true, return_since_start: 0, open_interest_change_since_start: 0}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735725600000, offset_hours: 0, is_year_control: true, is_recent_control: true, return_since_start: 0.25, open_interest_change_since_start: 0}
        - {pump_event_id: e1, symbol: AAA, control_open_time_ms: 1735725600000, offset_hours: 1, is_year_control: true, is_recent_control: true, return_since_start: 0, open_interest_change_since_start: 0}

  - name: profile_compares_events_with_their_own_matched_controls
    description: >
      e1 (single coin) and e2 (multi coin) at offset 0, per-event values and excess from
      fct_pump_event_excess. Volume: e1 4 against controls 1, 2 and 6 (median 2, mean 3),
      e2 6 against 1 and 1 -> median excess (2 + 5) / 2. A recent-pool control (volume
      100) must not enter the year comparison. Open interest: only e1 has a value, so only
      its recent control counts; e2's recent control (0.9) is not matched, and the year
      control's 0.5 is the wrong pool. No multi-coin open interest row.
    model: mart_pump_profile
    given:
      - input: ref('fct_pump_events')
        rows:
          - {pump_event_id: e1, event_scope: single_coin}
          - {pump_event_id: e2, event_scope: multi_coin}
      - input: ref('fct_pump_event_excess')
        rows:
          - {pump_event_id: e1, offset_hours: 0, metric: volume_ratio, value: 4, excess: 2}
          - {pump_event_id: e2, offset_hours: 0, metric: volume_ratio, value: 6, excess: 5}
          - {pump_event_id: e1, offset_hours: 0, metric: open_interest_change_since_start, value: 0.1, excess: -0.1}
      - input: ref('fct_pump_control_window')
        rows:
          - {pump_event_id: e1, control_open_time_ms: 1, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1, open_interest_change_since_start: 0.5}
          - {pump_event_id: e1, control_open_time_ms: 2, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 2}
          - {pump_event_id: e1, control_open_time_ms: 7, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 6}
          - {pump_event_id: e1, control_open_time_ms: 3, offset_hours: 0, is_year_control: false, is_recent_control: true, volume_ratio: 100, open_interest_change_since_start: 0.2}
          - {pump_event_id: e2, control_open_time_ms: 4, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1}
          - {pump_event_id: e2, control_open_time_ms: 5, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1}
          - {pump_event_id: e2, control_open_time_ms: 6, offset_hours: 0, is_year_control: false, is_recent_control: true, open_interest_change_since_start: 0.9}
    expect:
      rows:
        - {event_scope: all, offset_hours: 0, metric: volume_ratio, events: 2, event_median: 5, event_p25: 4.5, event_p75: 5.5, control_hours: 5, control_median: 1, median_excess: 3.5}
        - {event_scope: single_coin, offset_hours: 0, metric: volume_ratio, events: 1, event_median: 4, event_p25: 4, event_p75: 4, control_hours: 3, control_median: 2, median_excess: 2}
        - {event_scope: multi_coin, offset_hours: 0, metric: volume_ratio, events: 1, event_median: 6, event_p25: 6, event_p75: 6, control_hours: 2, control_median: 1, median_excess: 5}
        - {event_scope: all, offset_hours: 0, metric: open_interest_change_since_start, events: 1, event_median: 0.1, event_p25: 0.1, event_p75: 0.1, control_hours: 1, control_median: 0.2, median_excess: -0.1}
        - {event_scope: single_coin, offset_hours: 0, metric: open_interest_change_since_start, events: 1, event_median: 0.1, event_p25: 0.1, event_p75: 0.1, control_hours: 1, control_median: 0.2, median_excess: -0.1}

  - name: event_excess_against_the_event_own_pool_and_offset
    description: >
      Offset 0. e1 volume 4 against its year controls 1, 2, 6 (median 2); the recent-only
      control (100) and a control at offset 1 (50) must not count. e1 open interest 0.125
      against its recent controls 0.25 and -0.375 (the year control's 0.5 is the wrong
      pool): median -0.0625, half above and half below zero. e1 funding premium -0.0001
      against -0.0002, 0, 0, 0.0003: a control at exactly 0 is neither above nor below.
      Values are exact in binary: value is a DOUBLE in DuckDB (source note 109).
      e2 has no open interest value, so its recent control makes no row; its taker share
      has no control value at all: the row stays, with NULL median and excess.
    model: fct_pump_event_excess
    given:
      - input: ref('fct_pump_event_window')
        rows:
          - {pump_event_id: e1, offset_hours: 0, volume_ratio: 4, open_interest_change_since_start: 0.125, funding_premium_8h: -0.0001}
          - {pump_event_id: e2, offset_hours: 0, volume_ratio: 6, taker_buy_share: 0.6}
      - input: ref('fct_pump_control_window')
        rows:
          - {pump_event_id: e1, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1, open_interest_change_since_start: 0.5, funding_premium_8h: -0.0002}
          - {pump_event_id: e1, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 2, funding_premium_8h: 0}
          - {pump_event_id: e1, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 6, funding_premium_8h: 0}
          - {pump_event_id: e1, offset_hours: 0, is_year_control: true, is_recent_control: false, funding_premium_8h: 0.0003}
          - {pump_event_id: e1, offset_hours: 0, is_year_control: false, is_recent_control: true, volume_ratio: 100, open_interest_change_since_start: 0.25, funding_premium_8h: -0.5}
          - {pump_event_id: e1, offset_hours: 0, is_year_control: false, is_recent_control: true, open_interest_change_since_start: -0.375}
          - {pump_event_id: e1, offset_hours: 1, is_year_control: true, is_recent_control: false, volume_ratio: 50}
          - {pump_event_id: e2, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1}
          - {pump_event_id: e2, offset_hours: 0, is_year_control: true, is_recent_control: false, volume_ratio: 1}
          - {pump_event_id: e2, offset_hours: 0, is_year_control: false, is_recent_control: true, open_interest_change_since_start: 0.9}
    expect:
      rows:
        - {pump_event_id: e1, offset_hours: 0, metric: volume_ratio, value: 4, control_hours: 3, control_median: 2, control_share_above_zero: 1, control_share_below_zero: 0, excess: 2}
        - {pump_event_id: e1, offset_hours: 0, metric: open_interest_change_since_start, value: 0.125, control_hours: 2, control_median: -0.0625, control_share_above_zero: 0.5, control_share_below_zero: 0.5, excess: 0.1875}
        - {pump_event_id: e1, offset_hours: 0, metric: funding_premium_8h, value: -0.0001, control_hours: 4, control_median: 0, control_share_above_zero: 0.25, control_share_below_zero: 0.25, excess: -0.0001}
        - {pump_event_id: e2, offset_hours: 0, metric: volume_ratio, value: 6, control_hours: 2, control_median: 1, control_share_above_zero: 1, control_share_below_zero: 0, excess: 5}
        - {pump_event_id: e2, offset_hours: 0, metric: taker_buy_share, value: 0.6, control_hours: 0, control_median: null, control_share_above_zero: null, control_share_below_zero: null, excess: null}

  - name: signal_check_counts_next_hour_pumps_per_rule_and_day
    description: >
      Threshold 5 %. AAA on 2025-01-01: 00 has no baseline; 01 (volume 2x, +1 %) is
      followed by exactly +5 % (a pump); 02 (3x, +5 %: not below the threshold) by +4.99 %;
      03 has no next hour (04 is missing: 05's +6 % is two hours later and must not count);
      05 (3x, +6 %: neither flat nor below the threshold) by +10 %;
      06 has no next hour of its own - BBB's 07 must not be taken for it. BBB on
      2025-01-02: 00 (3x, +2 %: not flat) is followed by +7 %.
    model: mart_pump_signal_check
    overrides:
      vars:
        pump_min_return: 0.05
    given:
      - input: ref('int_binance__hourly_returns')
        rows:
          - {symbol: AAA, open_time_ms: 1735689600000, return_1h: 0, quote_volume: 10, quote_volume_baseline: null}
          - {symbol: AAA, open_time_ms: 1735693200000, return_1h: 0.01, quote_volume: 2, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735696800000, return_1h: 0.05, quote_volume: 3, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735700400000, return_1h: 0.0499, quote_volume: 1.49, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735707600000, return_1h: 0.06, quote_volume: 3, quote_volume_baseline: 1}
          - {symbol: AAA, open_time_ms: 1735711200000, return_1h: 0.1, quote_volume: 1.5, quote_volume_baseline: 1}
          - {symbol: BBB, open_time_ms: 1735714800000, return_1h: 0.2, quote_volume: 1, quote_volume_baseline: null}
          - {symbol: BBB, open_time_ms: 1735776000000, return_1h: 0.02, quote_volume: 6, quote_volume_baseline: 2}
          - {symbol: BBB, open_time_ms: 1735779600000, return_1h: 0.07, quote_volume: 2, quote_volume_baseline: 2}
    expect:
      rows:
        - {rule: every_hour, signal_date: 2025-01-01, signal_hours: 3, followed_by_pump: 2}
        - {rule: volume_1_5x, signal_date: 2025-01-01, signal_hours: 3, followed_by_pump: 2}
        - {rule: volume_2x, signal_date: 2025-01-01, signal_hours: 3, followed_by_pump: 2}
        - {rule: volume_2x_flat_price, signal_date: 2025-01-01, signal_hours: 1, followed_by_pump: 1}
        - {rule: every_hour, signal_date: 2025-01-02, signal_hours: 1, followed_by_pump: 1}
        - {rule: volume_1_5x, signal_date: 2025-01-02, signal_hours: 1, followed_by_pump: 1}
        - {rule: volume_2x, signal_date: 2025-01-02, signal_hours: 1, followed_by_pump: 1}
        - {rule: volume_3x_rising_below_threshold, signal_date: 2025-01-02, signal_hours: 1, followed_by_pump: 1}
