# Connection of dbt to the DuckDB warehouse: one local file, no account, no secrets.
# The path comes from the environment (.env in the repo root, loaded by dbt 1.12 itself):
#   DUCKDB_PATH   the warehouse file, e.g. warehouse/crypto_dwh.duckdb - relative to the
#                 working directory (run dbt from the repo root); its directory must exist
crypto_market_dwh:
  target: prod
  outputs:
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH') }}"
      schema: staging
      threads: 4
      settings:
        # timestamptz is shown in the session's zone: every reader of the warehouse uses UTC.
        TimeZone: UTC
        # Two pipelines share a 6 GB Docker VM until the switch-over; DuckDB spills to disk.
        # GiB: DuckDB reads GB as 10^9 bytes.
        memory_limit: 1GiB
        # DuckDB's own worker threads (default: every core); not dbt's threads above.
        threads: 4
