[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# Installed dbt packages are third-party code; exclude them explicitly instead of
# relying on .gitignore, which is absent in the Docker image.
extend-exclude = ["dbt/dbt_packages"]
# Airflow puts the DAGs folder on sys.path: dags/alerting imports as first-party code.
src = [".", "dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["ingestion", "dashboard", "analysis", "research", "signals", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
